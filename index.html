<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISS Tracker</title>
    <!-- leaflet CSS file-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000218;
            color: #f8fafc;
            font-family: Orbitron, sans-serif;
        }

        #map {
            height: 90vh;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
        }

        #dashboard-panel {
            display: flex;
            justify-content: left;
            gap: 20px;
            padding: 15px;
        }

        .info-card {
            background: rgba(0, 20, 60, 0.6);
            border: 1px solid #1e3a8a;
            padding: 15px 25px;
            border-radius: 8px;
            min-width: 220px;
        }

    </style>
</head>
<body>
    <h1>Live ISS Tracker</h1>
    <div id="dashboard-panel">
        <!--- Telemetry Data here -->
        <div id="Telemetry" class="info-card">
            <h2> Telemetry Data </h2>
            <div>Latitude: <span id="lat" style="font-weight: bold;">--</span></div>
            <div>Longitude: <span id="lon" style="font-weight: bold;">--</span></div>
            <div>Altitude: <span id="alt" style="font-weight: bold;">--</span></div>
            <div>Velocity: <span id="vel" style="font-weight: bold;">--</span></div>
        </div>

        <!--- Crew list--->
        <div id="Crew" class="info-card">
            <h2>Astronauts on board</h2>
            <ul id="crew-list" style="padding-left: 20px; margin: 5px 0;">
                <li>Loading Crew...</li>
            </ul>
        </div>
    </div>
    <!-- Map drawn here -->
    <div id="map"></div>
    <!-- Leaflet JS file -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0,0], 2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, and the GIS User Community'
        }).addTo(map);

        const issIcon = L.icon({
            iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/d/d0/International_Space_Station.svg',
            iconSize: [50, 30],
            iconAnchor: [25, 15]
        })

        const marker = L.marker([0,0], { icon: issIcon }).addTo(map);
        const issPath = [];

        const flightPath = L.polyline([], {
            color: '#ff0000',
            weight: 6,
            opacity: 0.7
        }).addTo(map);

        async function getISS() {
            try {
                const response = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                const data = await response.json();

                const { latitude, longitude, altitude, velocity } = data;

                marker.setLatLng([latitude, longitude]);
                map.setView([latitude, longitude], map.getZoom());

                issPath.push([latitude, longitude]);
                flightPath.setLatLngs(issPath);

                document.getElementById('lat').textContent = latitude.toFixed(2);
                document.getElementById('lon').textContent = longitude.toFixed(2);
                document.getElementById('alt').textContent = altitude.toFixed(1) + ' km';
                document.getElementById('vel').textContent = Math.round(velocity).toLocaleString() + ' km/h';

                console.log(`ISS Position: Lat. ${latitude}, Lon. ${longitude}`);
            } catch (error) {
                console.error('Error. Cannot fetch ISS location data: ', error);
            }
        }

        async function getCrew() {
            try {
                const response = await fetch('https://corquaid.github.io/international-space-station-APIs/JSON/people-in-space.json');
                const data = await response.json();

                const crewList = document.getElementById('crew-list');
                crewList.innerHTML = '';

                data.people.forEach(person => {
                    if (person.iss == true) {
                        const li = document.createElement('li');
                        li.textContent = `${person.name}---${person.country}---${person.position}`;
                        crewList.appendChild(li);
                    }    
                });
            } catch (error) {
                console.error('Error fetching crew data: ', error);
                document.getElementById('crew-list').innerHTML = '<li>Unable to load crew data</li>';
            }
        }

        getISS();
        getCrew();

        setInterval(getISS, 2500);
    </script>
</body>
</html>
